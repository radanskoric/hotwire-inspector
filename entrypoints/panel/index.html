<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotwire Inspector</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="app">
      <header class="toolbar">
        <div>
          <h1>Hotwire Inspector</h1>
          <p id="summary">Loading…</p>
        </div>
        <div class="toolbar-actions">
          <label class="theme-control">
            <span>Theme</span>
            <select
              id="theme-select"
              class="theme-select"
              data-controller="theme"
              data-action="change->theme#setTheme"
            >
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <button
            id="refresh-button"
            class="btn"
            type="button"
            title="Refresh"
            aria-label="Refresh"
          >
            <img src="/icons/refresh.svg" class="icon icon-btn" />
          </button>
        </div>
      </header>
      <div class="workspace">
        <main>
          <div id="empty-state" class="empty-state" hidden>
            No turbo frames or Stimulus controllers found.
          </div>
          <div id="tree" class="tree" role="tree"></div>
        </main>
        <aside
          id="details-panel"
          class="details-panel"
          data-controller="details-panel"
          data-action="hotwire-inspector:show-controller-details@document->details-panel#show hotwire-inspector:scan-refreshed@document->details-panel#refresh keydown.esc@window->details-panel#close"
          aria-label="Controller details"
        >
          <header class="details-panel-header">
            <h2
              class="details-panel-title"
              data-details-panel-target="identifier"
            ></h2>
            <button
              type="button"
              class="details-panel-store"
              data-action="click->details-panel#storeInConsole"
              title="Store as global variable"
              aria-label="Store as global variable"
            >
              <img
                src="/icons/command-line.svg"
                class="icon"
                alt=""
                aria-hidden="true"
              />
            </button>
            <button
              type="button"
              class="details-panel-close"
              data-action="click->details-panel#close"
              aria-label="Close details"
            >
              ×
            </button>
          </header>
          <div class="details-panel-body">
            <details class="details-panel-section" open>
              <summary>Values</summary>
              <div
                class="details-panel-section-content"
                data-details-panel-target="values"
              ></div>
            </details>
            <details class="details-panel-section" open>
              <summary>Targets</summary>
              <div class="details-panel-section-content">TODO</div>
            </details>
            <details class="details-panel-section" open>
              <summary>Outlets</summary>
              <div class="details-panel-section-content">TODO</div>
            </details>
          </div>
        </aside>
      </div>
    </div>
    <template id="node-template">
      <div class="node expanded" data-controller="node">
        <div
          class="node-row"
          role="treeitem"
          data-controller="panel-node"
          data-action="mouseenter->panel-node#highlight mouseleave->panel-node#clearHighlight dblclick->node#toggleChildren"
        >
          <span
            class="node-toggle"
            data-action="click->node#toggleChildren:stop"
            aria-hidden="true"
          ></span>
          <img
            src="/icons/reveal-in-elements.svg"
            class="icon icon-btn"
            data-action="click->panel-node#inspect"
          />
          <span class="node-main">
            <span class="node-kind"></span>
            <span class="node-id"></span>
            <span class="node-src" hidden></span>
          </span>
          <span class="badges" hidden></span>
          <span class="target-badges" hidden></span>
        </div>
        <div
          class="node-children"
          role="group"
          hidden
          data-node-target="children"
        ></div>
      </div>
    </template>
    <template id="badge-template">
      <span class="badge"></span>
    </template>
    <template id="notice-template">
      <div
        class="status-notice"
        data-controller="status"
        role="status"
        aria-live="polite"
      >
        <span slot="text"></span>
      </div>
    </template>
    <script type="module" src="./main.js"></script>
  </body>
</html>
