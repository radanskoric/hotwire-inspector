<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotwire Inspector</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="app">
      <header class="toolbar">
        <div>
          <h1>Hotwire Inspector</h1>
          <p id="summary">Loading…</p>
        </div>
        <div class="toolbar-actions">
          <label class="theme-control">
            <span>Theme</span>
            <select
              id="theme-select"
              class="theme-select"
              data-controller="theme"
              data-action="change->theme#setTheme"
            >
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <button
            id="refresh-button"
            class="btn btn-large"
            type="button"
            title="Refresh"
            aria-label="Refresh"
          >
            <img src="/icons/refresh.svg" class="icon icon-btn" />
          </button>
        </div>
      </header>
      <div class="workspace">
        <main>
          <fieldset class="tab-switcher">
            <legend class="visually-hidden">View</legend>
            <input
              type="radio"
              name="panel-tab"
              id="tab-elements"
              class="tab-input"
              checked
            />
            <label class="tab" for="tab-elements">Hotwire Elements</label>
            <input
              type="radio"
              name="panel-tab"
              id="tab-events"
              class="tab-input"
            />
            <label class="tab" for="tab-events">Turbo Events</label>
          </fieldset>
          <section class="tab-panel" id="panel-elements">
            <div class="filter">
              <label class="visually-hidden" for="controller-filter"
                >Filter controllers</label
              >
              <select
                id="controller-filter"
                multiple
                aria-label="Filter controllers"
              ></select>
            </div>
            <div id="empty-state" class="empty-state" hidden>
              No turbo frames or Stimulus controllers found.
            </div>
            <div id="tree" class="tree" role="tree"></div>
          </section>
          <section
            id="panel-events"
            class="tab-panel"
            data-controller="turbo-events"
          >
            <div class="events-header">
              <div class="filter">
                <label class="visually-hidden" for="event-filter"
                  >Filter events</label
                >
                <select
                  id="event-filter"
                  multiple
                  data-turbo-events-target="filter"
                  disabled
                ></select>
              </div>
              <button
                type="button"
                class="btn btn-small events-clear"
                data-turbo-events-target="clear"
                data-action="click->turbo-events#clear"
              >
                Clear
              </button>
            </div>
            <p
              class="events-dropped-notice"
              data-turbo-events-target="droppedNotice"
              hidden
            ></p>
            <div
              class="events-list"
              data-turbo-events-target="list"
              role="log"
              aria-live="polite"
            ></div>
            <p class="events-empty">No Turbo events yet</p>
            <p class="events-no-matches">No events match the filter</p>
          </section>
        </main>
        <aside
          id="details-panel"
          class="details-panel"
          data-controller="details-panel stimulus-controller-details large-payload-details"
          data-details-panel-stimulus-controller-details-outlet="#details-panel"
          data-details-panel-large-payload-details-outlet="#details-panel"
          data-action="hotwire-inspector:show-event-attribute@document->details-panel#showEventAttribute hotwire-inspector:show-controller-details@document->details-panel#showControllerDetails hotwire-inspector:scan-refreshed@document->stimulus-controller-details#refresh details-panel:close-request->details-panel#close keydown.esc@window->details-panel#close"
          aria-label="Details"
        >
          <header class="details-panel-header">
            <h2
              class="details-panel-title"
              data-details-panel-target="title"
            ></h2>
            <button
              type="button"
              class="details-panel-store"
              data-action="click->stimulus-controller-details#storeInConsole"
              title="Store as global variable"
              aria-label="Store as global variable"
            >
              <img
                src="/icons/command-line.svg"
                class="icon"
                alt=""
                aria-hidden="true"
              />
            </button>
            <button
              type="button"
              class="details-panel-close"
              data-action="click->details-panel#close"
              aria-label="Close details"
            >
              ×
            </button>
          </header>
          <div class="details-panel-body">
            <pre
              class="event-attribute-content"
              data-large-payload-details-target="content"
            ></pre>
            <details class="details-panel-section" open>
              <summary>Values</summary>
              <div
                class="details-panel-section-content"
                data-stimulus-controller-details-target="values"
              ></div>
            </details>
            <details class="details-panel-section" open>
              <summary>Targets</summary>
              <div
                class="details-panel-section-content"
                data-stimulus-controller-details-target="targets"
              ></div>
            </details>
            <details class="details-panel-section" open>
              <summary>Outlets</summary>
              <div
                class="details-panel-section-content"
                data-stimulus-controller-details-target="outlets"
              ></div>
            </details>
          </div>
        </aside>
      </div>
    </div>
    <template id="node-template">
      <div class="node expanded" data-controller="node">
        <div
          class="node-row"
          role="treeitem"
          data-controller="panel-node"
          data-action="mouseenter->panel-node#highlight mouseleave->panel-node#clearHighlight dblclick->node#toggleChildren"
        >
          <span
            class="node-toggle"
            data-action="click->node#toggleChildren:stop"
            aria-hidden="true"
          ></span>
          <img
            src="/icons/reveal-in-elements.svg"
            class="icon icon-btn"
            data-action="click->panel-node#inspect"
          />
          <span class="node-main">
            <span class="node-kind"></span>
            <span class="node-id"></span>
            <span class="node-src" hidden></span>
          </span>
          <span class="badges" hidden></span>
          <span class="target-badges" hidden></span>
        </div>
        <div
          class="node-children"
          role="group"
          hidden
          data-node-target="children"
        ></div>
      </div>
    </template>
    <template id="badge-template">
      <span class="badge"></span>
    </template>
    <template id="details-element-row-template">
      <div class="node">
        <div
          class="node-row"
          data-controller="panel-node"
          data-panel-node-id-value=""
          data-action="mouseenter->panel-node#highlight mouseleave->panel-node#clearHighlight"
        >
          <img
            src="/icons/reveal-in-elements.svg"
            class="icon icon-btn"
            data-action="click->panel-node#inspect"
            alt=""
            aria-hidden="true"
          />
          <span class="node-kind"></span>
          <span class="node-id"></span>
          <span class="element-name"></span>
        </div>
      </div>
    </template>
    <template id="notice-template">
      <div
        class="status-notice"
        data-controller="status"
        data-status-tone-value=""
        role="status"
        aria-live="polite"
      >
        <span slot="text"></span>
      </div>
    </template>
    <script type="module" src="./main.js"></script>
  </body>
</html>
