title: Hotwire Inspector
description: A browser extension for inspecting Hotwire applications.
url: https://inspector.masterhotwire.com
baseurl: ""
lang: en-US
theme: jekyll-vitepress-theme
plugins:
  - jekyll-vitepress-theme

jekyll_vitepress:
  branding:
    site_title: Hotwire Inspector
    logo:
      default: /assets/images/icon.png
  footer:
    enabled: false

exclude:
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
