<!doctype html>
<html>
  <head>
    <title>Test Page</title>
    <script>
      window.modalController = {
        name: "modal-controller",
        valueDescriptorMap: {
          "data-modal-title-value": {
            name: "titleValue",
            type: "string",
            defaultValue: "",
          },
          "data-modal-count-value": {
            name: "countValue",
            type: "number",
            defaultValue: 0,
          },
          "data-modal-enabled-value": {
            name: "enabledValue",
            type: "boolean",
            defaultValue: false,
          },
        },
      };
      window.Stimulus = {
        getControllerForElementAndIdentifier(element, identifier) {
          if (
            identifier === "modal" &&
            element.matches('[data-controller~="modal"]')
          ) {
            return window.modalController;
          }

          return null;
        },
      };
    </script>
  </head>

  <body>
    <turbo-frame id="main-frame" src="/main" data-controller="sidebar">
      <turbo-frame id="nested-frame">
        <div
          data-controller="modal dropdown"
          data-modal-title-value="Greeting"
          data-modal-count-value="42"
        >
          Modal content
          <button
            id="modal-close"
            data-modal-target="closeButton trigger"
            data-dropdown-target="item"
          >
            Close
          </button>
        </div>
      </turbo-frame>
    </turbo-frame>
    <div data-controller="sidebar">Sidebar</div>
  </body>
</html>
